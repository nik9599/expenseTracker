spring.application.name=expenseTracker
logging.level.com.yourpackage.yourservice=DEBUG
# PostgreSQL Database Connection settings
spring.datasource.url=jdbc:postgresql://localhost:5432/expenseTracker
spring.datasource.username=postgres
spring.datasource.password=Nikhil@9599
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# 'update' automatically creates or modifies database tables to match your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Optional: Set to true to print out all SQL queries in your console (highly recommended for debugging)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Turns off the open-in-view warning log
spring.jpa.open-in-view=false